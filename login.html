<!DOCTYPE html>

    <meta charset="UTF-8">
    <title>UniBook - Login</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script src="script.js"></script>
</head>

<body>
    <header>
    <img src="logo.jpg" alt="UniBook logo" width="120" height="120" usemap="#logo" />
        <map name="logo">
            <area shape="rect" coords="0,0,120,120" href="about.html" alt="Go to About Us" />

        <a href="index.html">Home</a>

    </nav>
    <main>
        <h2>Login</h2>
        <form name="loginForm" method="post" onsubmit="return validateLogin()">
            <p>
                <label>
                    <b>Username:</b>
                    <input type="text" name="Username" size="20" maxlength="25" />
                </label>
            </p>                
            <p id="UserMsg"></p>

            <p>
                <label>
                    <b>Password:</b>
                    <input type="password" name="psword" size="20" maxlength="25" />
                </label>
            </p>            
            <p id="PassMsg"></p>

            <p>
                <input type="submit" value="Submit" size="10" />
                <input type="reset" value="Clear" size="10" />
            </p>
            <p id="loginResult"></p>


        </form>
        <p>If you don't have an account <a href="signup.html">Sign Up</a></p>
    </main>

    <footer>

        <div style="font-size: 20px; text-align: right;" >
